services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${FORME_OPS_POSTGRES_DB:-forme_ops}
      POSTGRES_USER: ${FORME_OPS_POSTGRES_USER:-forme}
      POSTGRES_PASSWORD: ${FORME_OPS_POSTGRES_PASSWORD:-forme_local_password}
    ports:
      - "${FORME_OPS_POSTGRES_PORT:-5433}:5432"
    volumes:
      - forme-ops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORME_OPS_POSTGRES_USER:-forme} -d ${FORME_OPS_POSTGRES_DB:-forme_ops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-api:
    build:
      context: ./analytics-api
    profiles: ["analytics"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANALYTICS_DATABASE_URL: postgresql://${FORME_OPS_POSTGRES_USER:-forme}:${FORME_OPS_POSTGRES_PASSWORD:-forme_local_password}@postgres:5432/${FORME_OPS_POSTGRES_DB:-forme_ops}
    ports:
      - "${ANALYTICS_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow-postgres:
    image: postgres:17-alpine
    profiles: ["analytics"]
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_local_password
    volumes:
      - forme-ops-airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  airflow-init:
    build:
      context: ./airflow
    profiles: ["analytics"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment: &airflow-common-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_password@airflow-postgres:5432/airflow
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-forme-local-airflow-jwt-secret-change-me}
      AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_PORT:-8081}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW_CONN_FORME_WAREHOUSE: postgresql://${FORME_OPS_POSTGRES_USER:-forme}:${FORME_OPS_POSTGRES_PASSWORD:-forme_local_password}@postgres:5432/${FORME_OPS_POSTGRES_DB:-forme_ops}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - forme-ops-airflow-logs:/opt/airflow/logs
    command: version

  airflow-apiserver:
    build:
      context: ./airflow
    profiles: ["analytics"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_DB_MIGRATE: "false"
      _AIRFLOW_WWW_USER_CREATE: "false"
    volumes: *airflow-common-volumes
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  airflow-scheduler:
    build:
      context: ./airflow
    profiles: ["analytics"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_DB_MIGRATE: "false"
      _AIRFLOW_WWW_USER_CREATE: "false"
    volumes: *airflow-common-volumes
    command: scheduler

  airflow-dag-processor:
    build:
      context: ./airflow
    profiles: ["analytics"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-common-environment
      _AIRFLOW_DB_MIGRATE: "false"
      _AIRFLOW_WWW_USER_CREATE: "false"
    volumes: *airflow-common-volumes
    command: dag-processor

volumes:
  forme-ops-postgres:
  forme-ops-airflow-postgres:
  forme-ops-airflow-logs:
