services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forme_ops}
      POSTGRES_USER: ${POSTGRES_USER:-forme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forme_local_password}
    ports:
      - "5432:5432"
    volumes:
      - forme-ops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forme} -d ${POSTGRES_DB:-forme_ops}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forme-ops-postgres:
