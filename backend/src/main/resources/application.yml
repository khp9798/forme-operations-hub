spring:
  application:
    name: forme-operations-hub
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/forme_ops}
    username: ${DATABASE_USERNAME:forme}
    password: ${DATABASE_PASSWORD:forme_local_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  batch:
    job:
      enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
